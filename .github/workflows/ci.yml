name: CI

# Static checks only. The full HTTP smoke suite (tests/http_smoke.ps1)
# needs XAMPP + local MariaDB and runs on the dev machine; CI carries the
# checks that run cross-platform:
#   1. php -l over every PHP file.
#   2. The inline-JS parse guard (tests/extract_admin_js.php + node
#      --check) on both dashboards - a syntax error in either page's main
#      script kills every function on it silently, which source greps
#      cannot see.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint every PHP file
        run: find . -type f -name "*.php" -not -path "./node_modules/*" -print0 | xargs -0 -n1 php -l

      # schema.sql (PostgreSQL/production) and schema.mysql.sql (MariaDB/
      # local) are both fresh-install sources, so they must describe the
      # same schema. A one-sided edit drifts them apart and only shows up
      # at deploy time - this check catches it on every push.
      - name: Schema parity (MariaDB vs PostgreSQL)
        run: php tests/schema_parity.php

      - name: Parse-check inline JS on both dashboards
        run: |
          set -e
          for page in student/dashboard.php admin/dashboard.php; do
            jsfile="$(php tests/extract_admin_js.php "$page")"
            node --check "$jsfile"
            echo "$page: inline JS parses clean"
          done
